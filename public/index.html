<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>견적 관리 사이트</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- 로그인 -->
<form id="login" class="card" hidden onsubmit="login(event)">
  <div class="brand" style="padding:0"><img src="/img/ui/logo-mark.svg" alt="" width="47" height="47"><div><b>견적 관리 사이트</b><span>직원용 · 공용 비밀번호로 접속</span></div></div>
  <input id="loginPw" class="input fill" type="password" placeholder="비밀번호" autocomplete="current-password" autofocus>
  <button class="btn-big">접속</button>
  <p id="loginMsg" class="err"></p>
</form>

<div id="app" hidden>
  <aside class="side no-print">
    <div class="brand"><img src="/img/ui/logo-mark.svg" alt="" width="47" height="47"><div><b>견적 관리 사이트</b><span>월 렌탈료 기준(VAT 포함)</span></div></div>
    <nav class="nav">
      <button data-page="quote" onclick="showPage('quote')"><img src="/img/ui/edit.svg" alt="" width="18" height="18">견적서 관리</button>
      <button data-page="dash" onclick="showPage('dash')"><img src="/img/ui/folder.svg" alt="" width="18" height="18">담당자 대시보드</button>
      <button data-page="price" onclick="showPage('price')"><img src="/img/ui/dollar-sign.svg" alt="" width="19" height="18">제품 금액 관리</button>
      <button data-page="images" onclick="showPage('images')"><img src="/img/ui/airplay.svg" alt="" width="18" height="18">이미지 리스트</button>
      <button class="plain" onclick="logout()">로그아웃</button>
    </nav>
  </aside>

  <main class="main">
    <section id="page-quote" hidden></section>
    <section id="page-dash" hidden></section>
    <section id="page-price" hidden></section>
    <section id="page-images" hidden></section>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="filePick" accept="image/png,image/jpeg,image/webp" hidden>

<script src="/vendor/html-to-image.js"></script>
<script src="/data.js"></script>
<script src="/sheet.js"></script>
<script src="/js/core.js"></script>
<script src="/js/quote.js"></script>
<script src="/js/dash.js"></script>
<script src="/js/price.js"></script>
<script src="/js/images.js"></script>
<script>boot();</script>
</body>
</html>
